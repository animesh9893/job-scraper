name: LinkedIn jobs (Python, JobSpy)

# Scrapes LinkedIn's public job search with the open-source JobSpy library (python/linkedin_jobspy.py): no
# Apify, no login. Then POSTs the jobs as JSON to the URL in the JOBS_POST_URL secret (README → Python LinkedIn
# scraper). Doesn't touch Supabase and isn't linked to scrape.yml or salaries.yml.
# No schedule: n8n starts it (POST …/actions/workflows/linkedin-jobspy.yml/dispatches).
on:
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Searches, comma-separated'
        required: false
        default: 'software engineer'
      location:
        description: 'Location'
        required: false
        default: 'India'
      hours_old:
        description: 'Only jobs posted in the last N hours'
        required: false
        default: '24'
      results:
        description: 'Jobs wanted per search'
        required: false
        default: '50'
      descriptions:
        description: 'yes = also fetch each job description (much slower)'
        type: choice
        options: ['no', 'yes']
        default: 'no'
      dry_run:
        description: 'yes = scrape only, do not POST (jobs.json is kept as a run artifact)'
        type: choice
        options: ['no', 'yes']
        default: 'no'
  pull_request:                 # smoke test on PRs that change the scraper: a small dry run, no secrets
    paths:
      - 'python/**'
      - '.github/workflows/linkedin-jobspy.yml'

concurrency:
  group: linkedin-jobspy-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    # Secrets are only handed to code that is already on main; PRs only get the dry run.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - name: Scrape and post
        run: python python/linkedin_jobspy.py
        env:
          KEYWORDS: ${{ github.event_name == 'pull_request' && 'software engineer' || inputs.keywords }}
          LOCATION: ${{ inputs.location || 'India' }}
          HOURS_OLD: ${{ inputs.hours_old || '24' }}
          RESULTS: ${{ github.event_name == 'pull_request' && '10' || inputs.results }}
          DESCRIPTIONS: ${{ inputs.descriptions }}
          DRY_RUN: ${{ github.event_name == 'pull_request' && 'yes' || inputs.dry_run }}
          JOBS_POST_URL: ${{ github.event_name != 'pull_request' && secrets.JOBS_POST_URL || '' }}
          JOBS_POST_TOKEN: ${{ github.event_name != 'pull_request' && secrets.JOBS_POST_TOKEN || '' }}
          JOBSPY_PROXIES: ${{ github.event_name != 'pull_request' && secrets.JOBSPY_PROXIES || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs
          path: jobs.json
          if-no-files-found: ignore
          retention-days: 3
