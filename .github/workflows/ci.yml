name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done
      - name: Config is valid
        run: node -e "import('./src/config.js').then(m => console.log(m.loadConfig().searches.map(s => s.name)))"
