name: CI

on:
  push:
    branches: [main]
  pull_request:                 # PRs from forks run with a read-only token and no secrets

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done
      - name: Config is valid
        run: node -e "import('./src/config.js').then(m => console.log('searchesPerRun:', m.loadConfig().searchesPerRun))"
