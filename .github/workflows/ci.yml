name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in src/*.js web/api/*.mjs; do node --check "$f"; done
      - name: Tests
        run: node --test test/*.test.js
      - name: Config is valid
        run: node -e "import('./src/config.js').then(m => console.log('searchesPerRun:', m.loadConfig().searchesPerRun))"
