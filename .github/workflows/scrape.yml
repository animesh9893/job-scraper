name: Scrape jobs

on:
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      searches:
        description: 'Search names from config.yaml, comma-separated (blank = all)'
        required: false
        default: ''
  # schedule:                   # later: uncomment to run daily at 09:00 IST
  #   - cron: '30 3 * * *'

concurrency:
  group: scrape                 # never run two scrapes at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Scrape and store
        run: node src/run.js "$SEARCHES"
        env:
          SEARCHES: ${{ inputs.searches }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Rebuilds the public job board (GitHub Pages) from the DB.
  # Turned off until you set the repo variable PUBLISH_SITE=true (see README → Public job board).
  publish:
    needs: scrape
    if: ${{ !cancelled() && vars.PUBLISH_SITE == 'true' }}   # also publish when only some searches failed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Build site
        run: node src/build-site.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
