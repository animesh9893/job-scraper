name: Scrape jobs

# LinkedIn job searches only: premium searches that are due plus the rotation (src/run.js), then links jobs to
# companies, tags them and looks up missing LinkedIn company IDs. By default it then sends Telegram alerts and
# writes LinkedIn posts for the new jobs (the two workflows below, also runnable on their own).
# Glassdoor salaries are separate: salaries.yml. No schedule: n8n starts every workflow (README → Workflows).
on:
  workflow_dispatch:            # "Run workflow" button, or POST …/actions/workflows/scrape.yml/dispatches
    inputs:
      searches:
        description: 'Search names, comma-separated (blank = premium due + next in rotation, all = every active search)'
        required: false
        default: ''
      alerts:
        description: 'yes = send Telegram alerts after the scrape (telegram-alerts.yml)'
        type: choice
        options: ['yes', 'no']
        default: 'yes'
      posts:
        description: 'yes = write LinkedIn posts after the scrape (linkedin-posts.yml)'
        type: choice
        options: ['yes', 'no']
        default: 'yes'
      force_posts:
        description: 'yes = write LinkedIn posts now, even if the last one is newer than linkedin.everyHours'
        required: false
        default: ''

concurrency:
  group: scrape                 # never run two scrapes at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    # Secrets are only handed to code that is already on main, never to another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300          # "all" runs every search, about 40s each
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Scrape and store
        run: node src/run.js "$SEARCHES"
        env:
          SEARCHES: ${{ inputs.searches }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  alerts:
    needs: scrape
    # Also after a partly failed scrape: the searches that worked still brought new jobs.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.alerts != 'no' }}
    uses: ./.github/workflows/telegram-alerts.yml
    secrets: inherit

  posts:
    needs: scrape
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.posts != 'no' }}
    uses: ./.github/workflows/linkedin-posts.yml
    with:
      force_posts: ${{ inputs.force_posts }}
    secrets: inherit
