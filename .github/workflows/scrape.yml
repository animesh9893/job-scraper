name: Scrape jobs

on:
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      searches:
        description: 'Search names, comma-separated (blank = next in rotation, all = every active search)'
        required: false
        default: ''
  schedule:                     # every 3 hours: the next searchesPerRun searches in the rotation
    - cron: '0 */3 * * *'

concurrency:
  group: scrape                 # never run two scrapes at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    # Secrets are only handed to code that is already on main, never to another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120          # "all" runs every search, about 40s each
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Scrape and store
        run: node src/run.js "$SEARCHES"
        env:
          SEARCHES: ${{ inputs.searches }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Send Telegram alerts
        if: ${{ !cancelled() }}   # also after a partly failed scrape; skips itself without the secret
        run: node src/telegram-notify.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Rebuilds the public job board (GitHub Pages) from the DB.
  # Turned off until you set the repo variable PUBLISH_SITE=true (see README → Public job board).
  publish:
    needs: scrape
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.PUBLISH_SITE == 'true' }}   # also publish when only some searches failed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Build site
        run: node src/build-site.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
