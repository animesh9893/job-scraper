name: Telegram bot setup

# Points the bot at the webhook on Vercel (web/api/telegram.mjs) and sets its command menu.
# Run once after the API is deployed with the Telegram env vars, and again if the URL or secret changes.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Where web/api runs (Vercel). Leave empty to use apiUrl from config/config.yaml'
        required: false

permissions:
  contents: read

jobs:
  setup:
    # Secrets are only handed to code that is already on main, never to another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node src/telegram-setup.js "$API_URL"
        env:
          API_URL: ${{ inputs.api_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
