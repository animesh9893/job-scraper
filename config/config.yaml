# Which Apify Actor to run. Swap this to change the job source.
actor: curious_coder/linkedin-jobs-scraper

# Label stored with every job, so jobs from different sources never collide.
source: linkedin

# Max seconds to wait for one Actor run before giving up.
timeoutSecs: 900

# Merged into every search's `input` (a search's own values win).
defaults:
  location: India
  datePosted: past24Hours
  limitPerSource: 20
  scrapeCompany: false

# Searches and categories live in Supabase (tables `searches` and `categories`).
# Manage them with `node src/searches.js` (see README) or in Supabase's Table Editor.
# Each scrape runs this many searches, the ones that ran longest ago first, so a limited
# Apify budget rotates through all of them. `node src/run.js all` runs every active search.
searchesPerRun: 2

# Premium companies (table `companies`, is_premium) are searched on LinkedIn by company ID in groups of
# companiesPerSearch, as searches premium-1, premium-2, … that run every intervalHours on top of the rotation.
# Each asks only for jobs posted in the last intervalHours + 1 hours, since the Actor bills every job it returns.
# Manage companies with `node src/companies.js` (see README).
premium:
  keywords: software engineer
  location: India
  intervalHours: 6
  jobsPerSearch: 25
  companiesPerSearch: 10

# Apify tokens (table apify_tokens, then the APIFY_TOKEN secret): switch to the next one when the
# current account has less than this many dollars of monthly credit left.
minRemainingUsd: 0.1

# Jobs matching these are dropped before they reach the DB (case-insensitive).
filters:
  excludeTitleWords: [intern, unpaid]
  excludeCompanies: []

# Public job board (GitHub Pages)
site:
  title: India & Remote Tech Jobs
  maxAgeDays: 30        # only list jobs first seen in the last N days
  maxJobs: 1000
