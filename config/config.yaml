# Which Apify Actor to run. Swap this to change the job source.
actor: curious_coder/linkedin-jobs-scraper

# Label stored with every job, so jobs from different sources never collide.
source: linkedin

# Max seconds to wait for one Actor run before giving up.
timeoutSecs: 900

# Merged into every search's `input` (a search's own values win).
defaults:
  location: India
  datePosted: past24Hours
  limitPerSource: 40
  scrapeCompany: false

# Searches and categories live in Supabase (tables `searches` and `categories`).
# Manage them with `node src/searches.js` (see README) or in Supabase's Table Editor.
# Each scrape (every 2 hours) runs this many searches, the ones that ran longest ago first, so a limited
# Apify budget rotates through all of them. `all` runs every active search each time. The Actor bills about
# $0.0018 per job it returns, so 25 searches at limitPerSource 40 is about $1.80 a run, $22 a day.
searchesPerRun: all

# Premium companies (table `companies`, is_premium) are searched on LinkedIn by company ID in groups of
# companiesPerSearch, as searches premium-1, premium-2, … that run every intervalHours on top of the rotation.
# Each asks only for jobs posted in the last intervalHours + 1 hours, since the Actor bills every job it returns.
# Manage companies with `node src/companies.js` (see README).
premium:
  keywords: software engineer
  location: India
  intervalHours: 2
  jobsPerSearch: 25
  companiesPerSearch: 10
  # Premium companies without a LinkedIn ID get it looked up from their LinkedIn page (learned from their
  # jobs), this many per run, about $0.0015 each. A page without an ID is tried again a week later.
  lookupsPerRun: 3

# Glassdoor salaries per role (table company_salaries), shown on the site as a range with a per-role list.
# After each scrape, up to companiesPerRun companies (premium first, then the ones with most recent jobs)
# that were never fetched, or were fetched more than refreshDays ago, are fetched for every role below: one
# Actor run each, $0.02 plus $0.006 per role Glassdoor has (roles it doesn't have cost nothing). In between,
# the cached salaries are used. A failed fetch is retried a day later. companiesPerRun: 0 turns it off.
salaries:
  actor: axlymxp/glassdoor-salary-scraper
  companiesPerRun: 5
  refreshDays: 14
  location: India
  locationType: country    # city | state | country
  roles:
    - Software Engineer
    - Senior Software Engineer
    - Staff Software Engineer
    - Principal Software Engineer
    - Software Development Engineer
    - Software Development Engineer II
    - Senior Software Development Engineer
    - Frontend Developer
    - Backend Developer
    - Full Stack Developer
    - Android Developer
    - iOS Developer
    - Mobile Developer
    - DevOps Engineer
    - Site Reliability Engineer
    - QA Engineer
    - Data Engineer
    - Data Scientist
    - Machine Learning Engineer
    - Data Analyst
    - Engineering Manager
    - Product Manager
    - Senior Product Manager
    - Product Designer
    - Business Analyst

# Apify tokens (table apify_tokens, then the APIFY_TOKEN secret): switch to the next one when the
# current account has less than this many dollars of monthly credit left.
minRemainingUsd: 0.1

# Jobs matching these are dropped before they reach the DB (case-insensitive).
filters:
  excludeTitleWords: [intern, unpaid]
  excludeCompanies: []

# Public job board (GitHub Pages)
site:
  title: India & Remote Tech Jobs
  maxAgeDays: 30        # only list jobs first seen in the last N days
  maxJobs: 1000

# LinkedIn hiring-alert posts (src/linkedin-posts.js, after each scrape). The best new jobs are split between
# these people, one post each with different jobs, shown on the private page /posts.html. Then each person's n8n
# is pinged (GitHub secret N8N_WEBHOOK_<ID>, e.g. N8N_WEBHOOK_ANIMESH) to email the post for approval and
# publish it. Setup: n8n/README.md.
linkedin:
  siteUrl: https://job-scraper-web-beryl.vercel.app # the job board; posts link each job to its /job.html page and end with the home page
  everyHours: 4         # at most one post per person this often; scrapes in between keep their jobs for the next post
  jobsPerPost: 10
  minJobs: 10           # no post for a person who would get fewer new jobs than this; they wait for the next one
  hashtags: [hiring, softwareengineering, techjobs, jobsearch]
  maxHashtags: 10       # configured hashtags first, then the jobs' roles, tech and cities
  people:
    - id: animesh
      name: Animesh
    - id: sachin
      name: Sachin
