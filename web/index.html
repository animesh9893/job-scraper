<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India &amp; Remote Tech Jobs</title>
<meta name="description" content="Fresh frontend, backend, full stack and mobile developer jobs in India and remote, updated regularly.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e4e4df;
    --accent: #2f5bd3; --on-accent: #ffffff; --accent-soft: #e8eefc; --chip: #f0f0ec;
    --remote: #0f7b4f; --remote-soft: #e3f4ec; --hybrid: #8a5a00; --hybrid-soft: #fbf0d9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1d1d1b; --text: #ecece8; --muted: #a0a09a; --border: #2e2e2b;
      --accent: #8aa8ff; --on-accent: #10172b; --accent-soft: #1f2a48; --chip: #262624;
      --remote: #5fd3a0; --remote-soft: #16352a; --hybrid: #e8b860; --hybrid-soft: #3a2e14;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }

  .controls { margin: 24px 0 8px; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tab {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .tab:hover { border-color: var(--accent); }
  .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .tab .n { opacity: .7; font-size: 12px; margin-left: 4px; }
  input[type="search"] {
    width: 100%; padding: 10px 14px; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .count { color: var(--muted); font-size: 14px; margin: 16px 0 8px; }

  ul.jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .job {
    position: relative;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: start;
    transition: border-color .15s, box-shadow .15s;
  }
  .job:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgb(0 0 0 / .06); }
  .job:has(a:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .job > div { grid-row: span 2; min-width: 0; }
  .job h2 { margin: 0; font-size: 16px; line-height: 1.35; }
  .job h2 a { color: var(--text); text-decoration: none; outline: none; }
  /* The title link covers the whole card, so a click anywhere opens the job. */
  .job h2 a::after { content: ""; position: absolute; inset: 0; border-radius: 12px; }
  .job:hover h2 a { color: var(--accent); }
  .meta { color: var(--muted); font-size: 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--chip); color: var(--muted); }
  .badge.cat { background: var(--accent-soft); color: var(--accent); }
  .badge.remote { background: var(--remote-soft); color: var(--remote); }
  .badge.hybrid { background: var(--hybrid-soft); color: var(--hybrid); }
  .when { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .apply {
    grid-column: 2; justify-self: end; align-self: end; font-size: 14px;
    color: var(--accent); text-decoration: none; white-space: nowrap;
  }
  .job:hover .apply { text-decoration: underline; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  /* Off-screen cards skip layout and paint, so a long list stays smooth to scroll. */
  .job { content-visibility: auto; contain-intrinsic-size: auto 96px; }
  .more { text-align: center; color: var(--muted); font-size: 14px; padding: 16px 0; }
  .more[hidden] { display: none; }
  footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) {
    .job { grid-template-columns: 1fr; }
    .job > div { grid-row: auto; }
    .when, .apply { grid-column: 1; justify-self: start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">India &amp; Remote Tech Jobs</h1>
    <p>Frontend, backend, full stack and mobile developer jobs in India and remote.</p>
  </header>

  <div class="controls">
    <div class="row" id="categories" role="group" aria-label="Category"></div>
    <div class="row" id="workplaces" role="group" aria-label="Workplace"></div>
    <input type="search" id="q" placeholder="Search title, company or location…" aria-label="Search jobs">
  </div>

  <p class="count" id="count" aria-live="polite">Loading jobs…</p>
  <ul class="jobs" id="list"></ul>
  <div class="more" id="more" hidden>Loading more jobs…</div>

  <footer id="footer"></footer>
</div>

<script src="config.js"></script>
<script>
const PAGE_SIZE = 25;
const WORKPLACES = [['all', 'Anywhere'], ['remote', 'Remote'], ['hybrid', 'Hybrid'], ['onsite', 'On-site / not stated']];
let CATEGORIES = [['all', 'All']];   // filled from the categories table
const FALLBACK_CATEGORIES = [['frontend', 'Frontend'], ['backend', 'Backend'], ['fullstack', 'Full stack'], ['mobile', 'Mobile']]
  .map(([slug, label]) => ({ slug, label }));
let LABEL = {};

const state = { category: 'all', workplace: 'all', q: '' };
let source;        // where jobs come from: Supabase or jobs.json, same interface
let counts = [];   // [{ category, workplace, n }] for the tab counts
const list = { shown: 0, total: null, loading: false, generation: 0 };

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter(Boolean));
  return node;
};

// Only link out to http(s) URLs.
const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };

// "Fetched 5m ago" / "2h ago" / "3d ago": when the scraper first found the job.
function fetchedAgo(dateStr) {
  const mins = Math.floor((Date.now() - new Date(dateStr)) / 60000);
  if (!dateStr || Number.isNaN(mins)) return '';
  if (mins < 1) return 'Fetched just now';
  if (mins < 60) return `Fetched ${mins}m ago`;
  if (mins < 24 * 60) return `Fetched ${Math.floor(mins / 60)}h ago`;
  if (mins < 30 * 24 * 60) return `Fetched ${Math.floor(mins / 1440)}d ago`;
  return `Fetched ${new Date(dateStr).toLocaleDateString()}`;
}

const matchesCategory = (category, c) => c === 'all' || category === c;
const matchesWorkplace = (workplace, w) => w === 'all' || (w === 'onsite' ? !workplace : workplace === w);
// Drops characters that have a meaning in Supabase filters.
const cleanQuery = (q) => q.replace(/[,()*%\\"]/g, ' ').replace(/\s+/g, ' ').trim();

/** Reads jobs live from the Supabase views, PAGE_SIZE at a time, filtered in the database. */
async function supabaseSource() {
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
  const db = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  const run = async (query) => { const { data, count, error } = await query; if (error) throw error; return { data, count }; };
  return {
    footer: 'Live listings, updated after every scrape. They link to the original job posts; apply there.',
    categories: async () => (await run(db.from('public_categories').select('slug, label').order('sort_order').order('slug'))).data,
    counts: async () => (await run(db.from('public_job_counts').select('*'))).data,
    async page(f, offset) {
      let query = db.from('public_jobs').select('*', offset === 0 ? { count: 'exact' } : {})
        .order('firstSeenAt', { ascending: false }).order('id')   // id breaks ties, so pages never overlap
        .range(offset, offset + PAGE_SIZE - 1);
      if (f.category !== 'all') query = query.eq('category', f.category);
      if (f.workplace === 'onsite') query = query.is('workplace', null);
      else if (f.workplace !== 'all') query = query.eq('workplace', f.workplace);
      const q = cleanQuery(f.q);
      if (q) query = query.or(['title', 'company', 'location'].map((c) => `${c}.ilike.*${q}*`).join(','));
      const { data, count } = await run(query);
      return { jobs: data, total: count };
    },
  };
}

/** Same interface over jobs.json (built by src/build-site.js), filtered in the browser. */
async function jsonSource() {
  const r = await fetch('jobs.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error(r.status);
  const data = await r.json();
  const tally = new Map();
  for (const j of data.jobs) {
    const key = `${j.category}|${j.workplace}`;
    tally.set(key, { category: j.category, workplace: j.workplace, n: (tally.get(key)?.n ?? 0) + 1 });
  }
  return {
    title: data.title,
    footer: `Updated ${new Date(data.generatedAt).toLocaleString()}. Listings link to the original job posts; apply there.`,
    categories: async () => data.categories ?? [...new Set(data.jobs.map((j) => j.category).filter(Boolean))].map((slug) => ({ slug, label: slug })),
    counts: async () => [...tally.values()],
    async page(f, offset) {
      const q = cleanQuery(f.q).toLowerCase();
      const all = data.jobs.filter((j) => matchesCategory(j.category, f.category) && matchesWorkplace(j.workplace, f.workplace) &&
        (!q || [j.title, j.company, j.location].some((v) => v && v.toLowerCase().includes(q))));
      return { jobs: all.slice(offset, offset + PAGE_SIZE), total: all.length };
    },
  };
}

// Tab counts come from the counts view; while searching they'd be wrong, so they're hidden.
function renderButtons(container, options, key, countFor) {
  container.replaceChildren(...options.map(([value, label]) => {
    const b = el('button', { className: 'tab', type: 'button' }, label,
      !state.q.trim() && el('span', { className: 'n', textContent: countFor(value) }));
    b.setAttribute('aria-pressed', state[key] === value);
    b.onclick = () => { state[key] = value; sync(); };
    return b;
  }));
}

function renderTabs() {
  const sum = (pred) => counts.filter(pred).reduce((n, r) => n + r.n, 0);
  renderButtons($('categories'), CATEGORIES, 'category',
    (c) => sum((r) => matchesCategory(r.category, c) && matchesWorkplace(r.workplace, state.workplace)));
  renderButtons($('workplaces'), WORKPLACES, 'workplace',
    (w) => sum((r) => matchesCategory(r.category, state.category) && matchesWorkplace(r.workplace, w)));
}

function jobItem(j) {
  const url = safeUrl(j.url);
  const badges = [
    j.category && el('span', { className: 'badge cat', textContent: LABEL[j.category] ?? j.category }),
    j.workplace && el('span', { className: `badge ${j.workplace}`, textContent: j.workplace === 'remote' ? 'Remote' : 'Hybrid' }),
    j.seniority && j.seniority !== 'Not Applicable' && el('span', { className: 'badge', textContent: j.seniority }),
    j.employmentType && el('span', { className: 'badge', textContent: j.employmentType }),
  ];
  return el('li', { className: 'job' },
    el('div', {},
      el('h2', {}, url ? el('a', { href: url, target: '_blank', rel: 'noopener nofollow', textContent: j.title }) : j.title),
      el('div', { className: 'meta', textContent: [j.company, j.location].filter(Boolean).join(' · ') }),
      el('div', { className: 'badges' }, ...badges),
    ),
    el('span', { className: 'when', textContent: fetchedAgo(j.firstSeenAt), title: new Date(j.firstSeenAt).toLocaleString() }),
    url && el('span', { className: 'apply', ariaHidden: 'true', textContent: 'View job ↗' }),
  );
}

/** Starts the list over for the current filters. */
function resetList() {
  list.generation++;
  list.shown = 0;
  list.total = null;
  list.loading = false;
  $('list').replaceChildren();
  $('count').textContent = 'Loading jobs…';
  loadMore();
}

/** Appends the next PAGE_SIZE jobs; runs again while the end of the list is on screen. */
async function loadMore() {
  if (list.loading || (list.total !== null && list.shown >= list.total)) return;
  list.loading = true;
  const generation = list.generation;
  try {
    const { jobs, total } = await source.page(state, list.shown);
    if (generation !== list.generation) return;   // filters changed meanwhile
    if (total != null) list.total = total;
    if (jobs.length < PAGE_SIZE) list.total = list.shown + jobs.length;
    list.shown += jobs.length;
    $('list').append(...jobs.map(jobItem));
    $('count').textContent = `${list.total} job${list.total === 1 ? '' : 's'}`;
    if (list.total === 0) $('list').append(el('li', { className: 'empty', textContent: 'No jobs match these filters.' }));
  } catch {
    if (generation !== list.generation) return;
    $('count').textContent = 'Could not load jobs. Please try again later.';
    list.total = list.shown;
  } finally {
    if (generation === list.generation) list.loading = false;
  }
  if (generation !== list.generation) return;
  const more = list.shown < list.total;
  $('more').hidden = !more;
  if (more && $('more').getBoundingClientRect().top < innerHeight + 600) loadMore();
}

// Filters live in the URL (?category=backend&workplace=remote&q=react) so filtered views can be shared.
function sync() {
  const params = new URLSearchParams();
  for (const [k, v] of Object.entries(state)) if (v && v !== 'all') params.set(k, v);
  history.replaceState(null, '', params.size ? `?${params}` : location.pathname);
  renderTabs();
  resetList();
}

function readUrl() {
  const p = new URLSearchParams(location.search);
  if (CATEGORIES.some(([v]) => v === p.get('category'))) state.category = p.get('category');
  if (WORKPLACES.some(([v]) => v === p.get('workplace'))) state.workplace = p.get('workplace');
  state.q = p.get('q') ?? '';
  $('q').value = state.q;
}

let typing;
$('q').addEventListener('input', (e) => {
  clearTimeout(typing);
  typing = setTimeout(() => { state.q = e.target.value; sync(); }, 300);
});
new IntersectionObserver((entries) => { if (entries[0].isIntersecting) loadMore(); }, { rootMargin: '600px' })
  .observe($('more'));

// Live from Supabase when web/config.js has a project URL and anon key, otherwise from jobs.json.
(async () => {
  try {
    source = await (window.SUPABASE_URL && window.SUPABASE_ANON_KEY ? supabaseSource() : jsonSource());
    // Before the first scrape after an upgrade these views may not exist yet: the list still works.
    const [categories, rows] = await Promise.all([
      source.categories().catch(() => FALLBACK_CATEGORIES), source.counts().catch(() => []),
    ]);
    CATEGORIES = [['all', 'All'], ...categories.map((c) => [c.slug, c.label])];
    LABEL = Object.fromEntries(CATEGORIES);
    counts = rows;
    if (source.title) { document.title = source.title; $('title').textContent = source.title; }
    $('footer').textContent = source.footer;
    readUrl();
    sync();
  } catch {
    $('count').textContent = 'Could not load jobs. Please try again later.';
  }
})();
</script>
</body>
</html>
